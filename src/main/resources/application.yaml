spring:
  profiles:
    active:
        - ${SPRING_PROFILES_ACTIVE:development}
  application:
    name: vagando
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
      hibernate:
          ddl-auto: update
      show-sql: false
      properties:
          hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
  springdoc:
    api-docs:
      enabled: true
jwt:
    secret: ${JWT_SECRET}
